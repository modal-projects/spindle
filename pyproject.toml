[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-spindle"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=0.34",
    "modal>=1.5.3",
    "numpy>=1.26",
    "protobuf>=5.29",
    "pydantic>=2.13.4",
    "stitch @ git+https://github.com/modal-projects/stitch.git@d9f681fd894b02257da129ec3483a977659cd7ab",
    "tinker>=0.24.1,<0.26",
    "uvicorn>=0.52.0",
    "xxhash>=3.8.1",
    "zstandard>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.md", "src/spindle/proto/*_pb2.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "ruff==0.16.6",
]

[project.scripts]
spindle = "spindle.deployment_cli:main"
