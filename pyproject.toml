[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-spindle"
version = "0.1.0"
description = "Training and disaggregated sampling on Modal with a Tinker-compatible API"
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=0.34",
    "modal>=1.5.3",
    "protobuf>=5.29",
    "pydantic>=2.13.4",
    "stitch @ git+https://github.com/modal-projects/stitch.git@375a9396a7b05770dc4ed9cc5fe34fc4d5a472d5",
    "tinker>=0.24.1,<0.25",
    "uvicorn>=0.52.0",
    "xxhash>=3.8.1",
    "zstandard>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/modal-projects/spindle"
Documentation = "https://github.com/modal-projects/spindle/blob/main/README.md"
Repository = "https://github.com/modal-projects/spindle"
Issues = "https://github.com/modal-projects/spindle/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spindle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pytest>=9.1.1",
]

[project.scripts]
spindle = "spindle.deployment_cli:main"
