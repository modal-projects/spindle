name: Release

on:
  push:
    branches: [main]
    paths: [src/spindle/__init__.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and publish a GitHub Release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/spindle/__init__.py)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md
