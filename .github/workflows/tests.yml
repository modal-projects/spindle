name: Core CPU tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Run the newest Tinker SDK release as a canary that flags protocol drift
    # without blocking merges, because Spindle does not cap the SDK version.
    continue-on-error: ${{ matrix.tinker == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        # The package's minimum Tinker SDK, the release the server images pin,
        # and the newest release.
        tinker: ["0.24.1", "image-pin", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --locked --manifest-path rust/router/Cargo.toml
      - run: python -m pip install uv==0.9.26
      - run: uv sync --locked --python 3.12
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      # Runtime GPU dependencies live in the Modal image. Use CPU tensors here
      # so the loss, gradient, and FP32-head regressions also run in CI.
      - run: uv pip install --python .venv/bin/python torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the Tinker SDK under test
        run: |
          case "${{ matrix.tinker }}" in
            latest) requirement="tinker" ;;
            image-pin) requirement=$(sed -n 's/^TINKER_PACKAGE = "\(.*\)"$/\1/p' src/spindle/providers/modal/image_dependencies.py) ;;
            *) requirement="tinker==${{ matrix.tinker }}" ;;
          esac
          test -n "$requirement"
          uv pip install --python .venv/bin/python "$requirement" --upgrade-package tinker
      - run: uv run --no-sync pytest -q
      - run: uv build
