name: Deploy config-validation synmon

on:
  push:
    branches:
      - main
    paths:
      - "src/spindle/**"
      - "synthetic_monitoring/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy config-validation synmon on Modal
    runs-on: ubuntu-latest
    environment: gpu-ci
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: spindle-ci
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - run: python -m pip install uv==0.9.26

      - name: Sync dependencies
        run: uv sync --locked

      - name: Deploy Spindle config synmon on Modal
        run: uv run modal deploy -m synthetic_monitoring.config_validation::app
