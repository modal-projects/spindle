[package]
name = "spindle-router"
version = "0.1.0"
edition = "2021"

[lib]
name = "spindle_router"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py312"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
